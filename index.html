      recognising patterns, understanding language and solving problems.

<script>

const questions = \\\[

\&nbsp; {

\&nbsp;   q: "What does AI stand for?",

\&nbsp;   options: \\\["Artificial Intelligence", "Automatic Internet",

\&nbsp;             "Advanced Information", "Applied Innovation"],

\&nbsp;   answer: 0

\&nbsp; },

\&nbsp; {

\&nbsp;   q: "Which technology connects physical devices to the internet?",

\&nbsp;   options: \\\["Robotics only", "IoT", "Word processing", "Printing"],

\&nbsp;   answer: 1

\&nbsp; },

\&nbsp; {

\&nbsp;   q: "What does cybersecurity protect?",

\&nbsp;   options: \\\["Only books", "Only weather data",

\&nbsp;             "Devices, networks and information", "Only roads"],

\&nbsp;   answer: 2

\&nbsp; },

\&nbsp; {

\&nbsp;   q: "Which is a possible risk of AI?",

\&nbsp;   options: \\\["It never makes mistakes", "Privacy risks",

\&nbsp;             "It always knows everything", "It needs no design"],

\&nbsp;   answer: 1

\&nbsp; },

\&nbsp; {

\&nbsp;   q: "What is cloud computing used for?",

\&nbsp;   options: \\\["Only drawing clouds", "Growing plants",

\&nbsp;             "Online storage and computing services", "Making paper"],

\&nbsp;   answer: 2

\&nbsp; }

];



let current = 0;

let score = 0;

let answered = false;



function showQuestion() {

\&nbsp; answered = false;

\&nbsp; const q = questions\\\[current];

\&nbsp; document.getElementById("question").textContent =

\&nbsp;   (current + 1) + ". " + q.q;

\&nbsp; document.getElementById("result").textContent = "";

\&nbsp; document.getElementById("next").style.display = "none";



\&nbsp; const options = document.getElementById("options");

\&nbsp; options.innerHTML = "";



\&nbsp; q.options.forEach((option, index) => {

\&nbsp;   const button = document.createElement("button");

\&nbsp;   button.textContent = option;

\&nbsp;   button.style.cssText =

\&nbsp;     "padding:12px;border:1px solid #00cfff;border-radius:8px;" +

\&nbsp;     "background:#0c2144;color:white;cursor:pointer";

\&nbsp;   button.onclick = () => checkAnswer(index);

\&nbsp;   options.appendChild(button);

\&nbsp; });



\&nbsp; document.getElementById("score").textContent =

\&nbsp;   "Question " + (current + 1) + " of " + questions.length;

}



function checkAnswer(index) {

\&nbsp; if (answered) return;

\&nbsp; answered = true;



\&nbsp; if (index === questions\\\[current].answer) {

\&nbsp;   score++;

\&nbsp;   document.getElementById("result").textContent = "Correct! Well done.";

\&nbsp; } else {

\&nbsp;   document.getElementById("result").textContent =

\&nbsp;     "Not quite. Correct answer: " +

\&nbsp;     questions\\\[current].options\\\[questions\\\[current].answer];

\&nbsp; }



\&nbsp; document.getElementById("next").style.display = "inline-block";

}



function nextQuestion() {

\&nbsp; if (!answered) return;



\&nbsp; current++;



\&nbsp; if (current < questions.length) {

\&nbsp;   showQuestion();

\&nbsp; } else {

\&nbsp;   document.getElementById("question").textContent = "Quiz Completed!";

\&nbsp;   document.getElementById("options").innerHTML = "";

\&nbsp;   document.getElementById("result").textContent =

\&nbsp;     "Your score: " + score + " out of " + questions.length;

\&nbsp;   document.getElementById("score").textContent =

\&nbsp;     score === questions.length

\&nbsp;     ? "Excellent! You know your technology."

\&nbsp;     : "Keep learning and try again!";

\&nbsp;   document.getElementById("next").textContent = "Restart Quiz";

\&nbsp;   document.getElementById("next").onclick = restartQuiz;

\&nbsp; }

}



function restartQuiz() {

\&nbsp; current = 0;

\&nbsp; score = 0;

\&nbsp; document.getElementById("next").textContent = "Next Question →";

\&nbsp; document.getElementById("next").onclick = nextQuestion;

\&nbsp; showQuestion();

}



showQuestion();
